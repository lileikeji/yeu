allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - fast-uri@3.1.4
  - tar@7.5.21
  - brace-expansion@5.0.8

overrides:
  # Close GHSA-g7r4-m6w7-qqqr path for @nuxt/fonts fontless build tooling.
  fontless>esbuild: 0.28.1
  # Keep the callable v2 API while using the bounded expansion from 5.0.8.
  brace-expansion@2.1.2: file:vendor/brace-expansion-compat
  # Bump known-CVE transitive ranges to their patched versions.
  brace-expansion@5.0.8: 5.0.9
  fast-uri@3.1.4: 3.1.5
  js-yaml@4.3.0: 4.3.1
  nanoid@3.3.16: 3.3.18
  postcss@8.5.19: 8.5.23
