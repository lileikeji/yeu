<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f8fafc">
  <title>离线状态 | 迎新指南</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(720px,calc(100% - 32px));margin:0 auto;padding:12vh 0 48px}.mark{display:grid;width:48px;height:48px;place-items:center;border-radius:12px}.kicker{margin:24px 0 0;color:#0284c7;font-size:12px;font-weight:700;letter-spacing:.08em}.title{margin:8px 0 0;font-size:clamp(28px,7vw,42px);line-height:1.15}.lead{margin:16px 0 0;color:#475569;line-height:1.8}.card{margin-top:32px;padding:20px;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.card h2{margin:0;font-size:17px}.card p{margin:10px 0 0;color:#475569;font-size:14px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#0d9488;color:#fff;font:600 14px/44px system-ui;text-decoration:none;cursor:pointer}.button.secondary{border:1px solid #cbd5e1;background:#fff;color:#1e293b}
  </style>
</head>
<body>
  <main class="shell">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="48" height="48">
        <defs>
          <linearGradient id="off-bg" x1="36" y1="24" x2="476" y2="488" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF"/>
            <stop offset="0.52" stop-color="#F0F9FF"/>
            <stop offset="1" stop-color="#ECFDF5"/>
          </linearGradient>
          <clipPath id="off-cl"><rect x="0" y="0" width="256.5" height="512"/></clipPath>
          <clipPath id="off-cr"><rect x="256" y="0" width="256" height="512"/></clipPath>
          <linearGradient id="off-kl" x1="140" y1="52" x2="256" y2="248" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
          <linearGradient id="off-kr" x1="256" y1="52" x2="372" y2="248" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FB923C"/><stop offset="1" stop-color="#EA580C"/></linearGradient>
          <linearGradient id="off-bl" x1="56" y1="172" x2="256" y2="466" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
          <linearGradient id="off-br" x1="256" y1="172" x2="456" y2="466" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0284C7"/></linearGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#off-bg)"/>
        <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#CBD5E1" stroke-opacity="0.75" stroke-width="4"/>
        <g transform="translate(51.2, 49.2) scale(0.8)">
          <path d="M56,225.41 A32,32 0 0,1 103.1,197.2 L243.73,272.44 A26,26 0 0,0 268.27,272.44 L408.9,197.2 A32,32 0 0,1 456,225.41 L456,340.74 A32,32 0 0,1 438.99,369.02 L270.05,458.55 A30,30 0 0,1 241.95,458.55 L73.01,369.02 A32,32 0 0,1 56,340.74 L56,225.41Z" fill="url(#off-br)" clip-path="url(#off-cr)"/>
          <path d="M56,225.41 A32,32 0 0,1 103.1,197.2 L243.73,272.44 A26,26 0 0,0 268.27,272.44 L408.9,197.2 A32,32 0 0,1 456,225.41 L456,340.74 A32,32 0 0,1 438.99,369.02 L270.05,458.55 A30,30 0 0,1 241.95,458.55 L73.01,369.02 A32,32 0 0,1 56,340.74 L56,225.41Z" fill="url(#off-bl)" clip-path="url(#off-cl)"/>
          <path d="M239.37,71.21 A22,22 0 0,1 272.63,71.21 L352.34,163.29 A24,24 0 0,1 345.51,200.16 L266.37,242.46 A22,22 0 0,1 245.63,242.46 L166.49,200.16 A24,24 0 0,1 159.66,163.29 L239.37,71.21Z" fill="url(#off-kr)" clip-path="url(#off-cr)"/>
          <path d="M239.37,71.21 A22,22 0 0,1 272.63,71.21 L352.34,163.29 A24,24 0 0,1 345.51,200.16 L266.37,242.46 A22,22 0 0,1 245.63,242.46 L166.49,200.16 A24,24 0 0,1 159.66,163.29 L239.37,71.21Z" fill="url(#off-kl)" clip-path="url(#off-cl)"/>
        </g>
      </svg>
    </div>
    <p class="kicker">网络断开了</p>
    <h1 class="title">先检查网络，连上后再继续</h1>
    <p class="lead">校园地图、路线和最新通知需要联网查看。先检查 Wi-Fi 或移动网络，恢复连接后再确认报到日期、地点、营业时间和招新安排。</p>
    <section class="card" role="status">
      <h2 id="recovery-title">连上网络后再试一次</h2>
      <p id="recovery-status">恢复连接后会重新打开刚才的页面，继续查看最新内容。</p>
      <div class="actions">
        <button id="recovery-button" class="button" type="button">再试一次</button>
        <a class="button secondary" href="/">回到首页</a>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const button = document.getElementById('recovery-button')
      const title = document.getElementById('recovery-title')
      const status = document.getElementById('recovery-status')
      const candidates = [
        location.hostname
      ].filter((host, index, hosts) => host && hosts.indexOf(host) === index)

      async function probe(host) {
        const controller = new AbortController()
        const timer = setTimeout(() => controller.abort(), 3200)

        try {
          await fetch(`https://${host}/api/health?offline_recovery=${Date.now()}`, {
            cache: 'no-store',
            credentials: 'omit',
            mode: 'no-cors',
            redirect: 'follow',
            referrerPolicy: 'no-referrer',
            signal: controller.signal
          })
          return true
        } catch {
          return false
        } finally {
          clearTimeout(timer)
        }
      }

      async function recover() {
        button.disabled = true
        button.textContent = '正在检查…'
        title.textContent = '正在寻找可用线路'
        status.textContent = '会保留当前页面位置，无需重新查找内容。'

        const results = await Promise.all(candidates.map(async host => ({
          host,
          reachable: await probe(host)
        })))
        const target = results.find(result => result.reachable)

        if (!target) {
          title.textContent = '暂时还没有可用线路'
          status.textContent = '请切换 Wi-Fi 或移动网络后再试，页面会继续保留在这里。'
          button.disabled = false
          button.textContent = '重新检查'
          return
        }

        try {
          const registrations = await navigator.serviceWorker?.getRegistrations?.() || []
          await Promise.all(registrations.map(registration => registration.unregister().catch(() => false)))
          const cacheNames = await caches?.keys?.() || []
          await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)))
        } catch {
          // A reachable route is enough to recover even when the browser blocks cache cleanup.
        }

        const next = new URL(location.href)
        next.protocol = 'https:'
        next.hostname = target.host
        next.port = ''
        next.searchParams.set('_recovered', Date.now().toString())
        location.replace(next.toString())
      }

      button.addEventListener('click', recover)
      window.addEventListener('online', recover, { once: true })

      if (navigator.onLine) {
        recover()
      }
    })()
  </script>
</body>
</html>
