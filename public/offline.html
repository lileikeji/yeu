<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#104830">
    <meta name="robots" content="noindex,nofollow">
    <title>暂时无法连接 | 仰恩新生指南</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f8f6; color: #18181b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 560px); border-block: 1px solid #dfe4df; background: #fff; padding: 28px 20px; }
      .mark { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 6px; background: #fff7ed; color: #9a3412; font-weight: 800; }
      h1 { margin: 20px 0 0; font-size: 24px; line-height: 1.3; letter-spacing: 0; }
      p { margin: 12px 0 0; color: #52525b; font-size: 14px; line-height: 1.8; }
      .warning { border-left: 3px solid #f97316; background: #fff7ed; padding: 10px 12px; color: #7c2d12; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
      a { min-height: 44px; border-radius: 6px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #166534; font: inherit; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
      .primary { background: #166534; color: #fff; }
      a:not(.primary) { background: #fff; color: #166534; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">OFF</div>
      <h1>当前网络不可用</h1>
      <p>暂时无法从服务器获取这条校园信息。恢复网络后重新加载当前地址，即可获取最新发布内容。</p>
      <p class="warning">报到时间、地点、材料、营业时间和招新安排不要仅凭旧缓存行动。</p>
      <div class="actions">
        <a class="primary" href="">重新加载</a>
        <a href="/offline">查看离线说明</a>
      </div>
    </main>
  </body>
</html>
