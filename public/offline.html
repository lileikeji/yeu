<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#104830">
  <title>离线状态 | 迎新指南</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f8f6;color:#18181b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.shell{width:min(720px,calc(100% - 32px));margin:0 auto;padding:12vh 0 48px}.mark{display:grid;width:48px;height:48px;place-items:center;border-radius:12px;background:#104830;color:#fff;font-weight:800}.kicker{margin:24px 0 0;color:#176f46;font-size:12px;font-weight:700;letter-spacing:.08em}.title{margin:8px 0 0;font-size:clamp(28px,7vw,42px);line-height:1.15}.lead{margin:16px 0 0;color:#52525b;line-height:1.8}.card{margin-top:32px;padding:20px;border:1px solid #d4d4d8;border-radius:12px;background:#fff}.card h2{margin:0;font-size:17px}.card p{margin:10px 0 0;color:#52525b;font-size:14px;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.button{min-height:44px;padding:0 18px;border:0;border-radius:8px;background:#176f46;color:#fff;font:600 14px/44px system-ui;text-decoration:none;cursor:pointer}.button.secondary{border:1px solid #d4d4d8;background:#fff;color:#27272a}
  </style>
</head>
<body>
  <main class="shell">
    <div class="mark">迎</div>
    <p class="kicker">网络断开了</p>
    <h1 class="title">先检查网络，连上后再继续</h1>
    <p class="lead">校园地图、路线和最新通知需要联网查看。先检查 Wi-Fi 或移动网络，恢复连接后再确认报到日期、地点、营业时间和招新安排。</p>
    <section class="card" role="status">
      <h2 id="recovery-title">连上网络后再试一次</h2>
      <p id="recovery-status">恢复连接后会重新打开刚才的页面，继续查看最新内容。</p>
      <div class="actions">
        <button id="recovery-button" class="button" type="button">再试一次</button>
        <a class="button secondary" href="/">回到首页</a>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const button = document.getElementById('recovery-button')
      const title = document.getElementById('recovery-title')
      const status = document.getElementById('recovery-status')
      const candidates = [
        location.hostname,
        'cn.yeu.huiliyill.cn',
        'global.yeu.huiliyill.cn'
      ].filter((host, index, hosts) => host && hosts.indexOf(host) === index)

      async function probe(host) {
        const controller = new AbortController()
        const timer = setTimeout(() => controller.abort(), 3200)

        try {
          await fetch(`https://${host}/api/health?offline_recovery=${Date.now()}`, {
            cache: 'no-store',
            credentials: 'omit',
            mode: 'no-cors',
            redirect: 'follow',
            referrerPolicy: 'no-referrer',
            signal: controller.signal
          })
          return true
        } catch {
          return false
        } finally {
          clearTimeout(timer)
        }
      }

      async function recover() {
        button.disabled = true
        button.textContent = '正在检查…'
        title.textContent = '正在寻找可用线路'
        status.textContent = '会保留当前页面位置，无需重新查找内容。'

        const results = await Promise.all(candidates.map(async host => ({
          host,
          reachable: await probe(host)
        })))
        const target = results.find(result => result.reachable)

        if (!target) {
          title.textContent = '暂时还没有可用线路'
          status.textContent = '请切换 Wi-Fi 或移动网络后再试，页面会继续保留在这里。'
          button.disabled = false
          button.textContent = '重新检查'
          return
        }

        try {
          const registrations = await navigator.serviceWorker?.getRegistrations?.() || []
          await Promise.all(registrations.map(registration => registration.unregister().catch(() => false)))
          const cacheNames = await caches?.keys?.() || []
          await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)))
        } catch {
          // A reachable route is enough to recover even when the browser blocks cache cleanup.
        }

        const next = new URL(location.href)
        next.protocol = 'https:'
        next.hostname = target.host
        next.port = ''
        next.searchParams.set('_recovered', Date.now().toString())
        location.replace(next.toString())
      }

      button.addEventListener('click', recover)
      window.addEventListener('online', recover, { once: true })

      if (navigator.onLine) {
        recover()
      }
    })()
  </script>
</body>
</html>
