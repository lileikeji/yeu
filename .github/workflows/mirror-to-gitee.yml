name: mirror-to-gitee

# GitHub → Gitee 单向镜像（补齐双向同步的另一半）：
# - 本地/Gitee 侧提交走 `git push yuex`（双地址同推 Gitee+GitHub）
# - GitHub 网页编辑 / PR 合并产生的 master 新提交由本 workflow 回推 Gitee
# 无循环风险：本 workflow 只在 GitHub 收到 push 时触发，回推目标是 Gitee。
# 保护分支：GITEE_TOKEN 需为仓库 owner 的 PAT（owner 直推按 bypass 规则放行）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::notice::GITEE_TOKEN 未配置，跳过镜像（到仓库 Settings → Secrets and variables → Actions 添加后生效）"
            exit 0
          fi
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/yeu-yx/yeu.git"
          # 不用 --force：若 Gitee 侧已有分叉提交，让推送失败并暴露给人工处理，
          # 避免镜像悄悄覆盖 Gitee 上的新工作。
          git push gitee "HEAD:refs/heads/master"
