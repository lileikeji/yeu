name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # GitHub 托管 runner 仅 4 核，低于本仓库 8C/8G 构建门槛；
      # scripts/ci-build.sh（Gitee 云端 CI）导出的是同一个开关。
      ALLOW_LOW_SPEC_BUILD: 1
      # CI 无本地 .env：按生产形态构建（高德外链），否则落到 nuxt.config
      # 默认 maplibre-dev，整个 maplibre 打进包直接撑爆包体预算。
      NUXT_PUBLIC_MAP_PROVIDER: amap

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm e2e:install:ci

      - name: Verify code and production build
        # 与 scripts/ci-build.sh 同级闸门：typecheck + test + build + 预算 + PWA。
        # pnpm check 还含 eslint；仓库存在大量预存在 lint 债务（另行处理），
        # 不混进 CI 闸门。
        run: pnpm typecheck && pnpm test && pnpm build && pnpm bundle:budget && pnpm pwa:build:test

      - name: Verify browser flows
        run: pnpm run e2e:run
