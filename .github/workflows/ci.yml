name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # GitHub 托管 runner 仅 4 核，低于本仓库 8C/8G 构建门槛；
      # scripts/ci-build.sh（Gitee 云端 CI）导出的是同一个开关。
      ALLOW_LOW_SPEC_BUILD: 1
      # CI 无本地 .env：按生产形态构建（高德外链），否则落到 nuxt.config
      # 默认 maplibre-dev，整个 maplibre 打进包直接撑爆包体预算。
      NUXT_PUBLIC_MAP_PROVIDER: amap
      # nuxt typecheck 在默认 2G 堆上会 OOM（deploy 分支历史 ci 同样崩在这里），
      # 4 核 runner 内存足够，抬到 6G 一次跑通。
      NODE_OPTIONS: --max-old-space-size=6144
      # 强制 CI 密钥门禁必须执行 gitleaks 二进制，禁止降级跳过。
      REQUIRE_GITLEAKS: 1

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -f /tmp/gitleaks.tar.gz
          gitleaks version

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm e2e:install:ci

      - name: Verify code and production build
        # 一键门禁 pnpm verify 覆盖：架构边界 + AST 守卫 + 密钥检查 + typecheck + test + build + 包体预算 + PWA。
        # 仓库仍存在大量预存格式债务（eslint .），暂保留在 pnpm check 中独立处理，不混进 CI 闸门。
        run: pnpm verify

      - name: Verify browser flows
        run: pnpm run e2e:run
