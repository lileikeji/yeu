version: "1.0"
name: 生产部署
displayName: 生产部署（push master → 质量检查 → 服务器部署）
# 使用前提（Gitee 仓库控制台一次性配置，约 10 分钟）：
# 1. 仓库开通流水线；配额以账户控制台为准。
# 2. 「主机管理」新建主机组（名称需与下方 hostGroupID 一致，默认 yeu-prod），
#    加入生产服务器并配置 SSH 凭据；服务器 IP 等部署环境信息不入仓库。
# 3. 如需限定只有特定仓库触发部署，在流水线环境变量配置 YEU_DEPLOY_REPO=<owner>/<repo>。
# 构建发生在 Gitee 云端环境，不占用生产服务器资源；服务器只执行部署脚本。
strategy:
  # 认证只在代码克隆阶段可用；保留近期历史供生产 SHA 比较，避免拉取完整历史。
  cloneDepth: 50
stages:
- name: 构建
  displayName: 云端完整质量检查与构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: build-and-test
    displayName: 安装/质量检查/制品核验
    nodeVersion: "20.10.0"
    commands:
    # Gitee Go 的 nodejs step 版本枚举最高只到 20，而 engines 要求 ^22.22.3+——
    # ci-bootstrap.sh 自行解压 Node 22.23.4 官方二进制（sha256 校验），PATH 前置覆盖。
    # Gitee step 的 commands 行间失败不中断（实测），关键链在严格失败退出的单个脚本内执行。
    - timeout 45m bash scripts/ci-build.sh
    artifacts:
    - name: RELEASE
      path:
      - yeu-release.tar.gz
      type: .tar.gz
    caches:
    - "~/.cache/yeu-ci"
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
- name: 部署
  displayName: 主机部署（备份 → 冒烟 → 切换 → 健康检查）
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@agent
    name: deploy-to-server
    displayName: 部署到生产服务器
    deployArtifact:
    - name: release
      # deployArtifact.target 实测不展开系统变量；脚本再原子移入独占目录。
      target: /root/gitee-deploy/yeu/incoming/
      source: build
      dependArtifact: RELEASE
      artifactRepository: default
      artifactName: output
      artifactVersion: latest
    script: |-
      set -euo pipefail
      : "${GITEE_PIPELINE_BUILD_NUMBER:?缺少构建号}"
      : "${GITEE_COMMIT:?缺少完整提交号}"
      [[ "$GITEE_PIPELINE_BUILD_NUMBER" =~ ^[0-9]+$ ]]
      [[ "$GITEE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      [[ "${YEU_DEPLOY_REPO:-}" == "" || "$GITEE_REPO" == "$YEU_DEPLOY_REPO" ]]
      [[ "$GITEE_BRANCH" == "master" ]]
      mkdir -p /root/gitee-deploy/yeu/incoming
      exec 9>/root/gitee-deploy/yeu/transfer.lock
      flock -w 60 9
      INCOMING="$(mktemp -d "/root/gitee-deploy/yeu/incoming/$GITEE_PIPELINE_BUILD_NUMBER.XXXXXX")"
      TRANSFER_VALID=0
      WORK_DIR="$(mktemp -d /root/gitee-deploy/yeu/run.XXXXXX)"
      cleanup() {
        [[ "$WORK_DIR" == /root/gitee-deploy/yeu/run.* ]] && rm -rf -- "$WORK_DIR"
        if [[ "$TRANSFER_VALID" == "1" ]]; then
          rm -f -- "$INCOMING/release.tar.gz"
          rmdir -- "$INCOMING" 2>/dev/null || true
        fi
      }
      trap cleanup EXIT
      test -s /root/gitee-deploy/yeu/incoming/release.tar.gz
      mv -- /root/gitee-deploy/yeu/incoming/release.tar.gz "$INCOMING/release.tar.gz"
      # Gitee 制品机制会把 artifacts.path 声明的文件再包一层 tar（同 dianzi 首跑踩坑）：
      # release.tar.gz 解开后是构建命令产出的 yeu-release.tar.gz，需解两层
      tar zxf "$INCOMING/release.tar.gz" -C "$WORK_DIR"
      INNER="$(find "$WORK_DIR" -name 'yeu-release.tar.gz' -print -quit)"
      test -s "$INNER"
      tar zxf "$INNER" -C "$WORK_DIR"
      # 提交号一致性：制品内 build-sha 必须等于本次流水线触发的提交
      BUILD_SHA="$(cat "$WORK_DIR/build-sha.txt")"
      [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
      [[ "$BUILD_SHA" == "$GITEE_COMMIT" ]]
      RELEASE_ID="$(cat "$WORK_DIR/release-id.txt")"
      [[ "$RELEASE_ID" =~ ^[0-9]{8}-[0-9]{6}-${GITEE_PIPELINE_BUILD_NUMBER}-${BUILD_SHA:0:12}-[0-9a-f]{8}$ ]]
      TRANSFER_VALID=1
      flock -u 9
      MODE="$(cat "$WORK_DIR/release-mode.txt")"
      if [[ "$MODE" == "docs-only" ]]; then
        echo "纯文档制品：未备份数据库、未切换 release、未重启服务"
        exit 0
      fi
      [[ "$MODE" == "deploy" ]]
      test -f "$WORK_DIR/.output/server/index.mjs"
      test -f "$WORK_DIR/scripts/server-side-deploy.sh"
      # 复用与本地 deploy.sh 相同的服务端脚本（备份/冒烟/切换/回滚/标记）
      ARCHIVE="$WORK_DIR/release-bundle.tar.gz"
      tar -czf "$ARCHIVE" -C "$WORK_DIR" .output
      RELEASE_ID="$RELEASE_ID" DEPLOY_SHA="$BUILD_SHA" \
        DEPLOY_TS="$(date +%Y%m%d-%H%M%S)" ARCHIVE="$ARCHIVE" \
        bash "$WORK_DIR/scripts/server-side-deploy.sh" 2>&1 | tee "$WORK_DIR/deploy.log"
    hostGroupID:
      # Gitee 控制台主机组名（不含服务器 IP）；与「主机管理」里的配置保持一致
      ID: yeu-prod
      hostID:
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    branches:
      prefix: []
      precise:
      - master
      include: []
notify: []
