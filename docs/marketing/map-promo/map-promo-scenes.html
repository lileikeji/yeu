<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仰恩新生指南 · 地图找楼</title>
  <style>
    :root {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #10211b;
      background: #eef3f0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: #eef3f0; }
    .film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #eef3f0; }
    .film::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .42;
      background-image: radial-gradient(rgba(18, 74, 57, .18) 1.5px, transparent 1.5px);
      background-size: 34px 34px;
      mask-image: linear-gradient(#000, transparent 52%);
    }
    .brand {
      position: absolute;
      z-index: 20;
      top: 72px;
      left: 62px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 58px;
      padding: 0 24px;
      color: #0b5b40;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(15, 107, 75, .14);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(20, 67, 52, .08);
      font-size: 27px;
      font-weight: 800;
    }
    .brand-mark { width: 16px; height: 16px; border-radius: 50%; background: #13a16e; box-shadow: 0 0 0 9px rgba(19,161,110,.12); }
    .counter {
      position: absolute;
      z-index: 20;
      right: 62px;
      top: 81px;
      color: #587068;
      font-size: 24px;
      font-weight: 700;
    }
    .headline {
      position: absolute;
      z-index: 20;
      top: 174px;
      left: 62px;
      right: 62px;
      font-size: 76px;
      line-height: 1.12;
      font-weight: 950;
      letter-spacing: 0;
    }
    .headline strong { color: #08754f; }
    .stage {
      position: absolute;
      z-index: 4;
      left: 56px;
      right: 56px;
      top: 405px;
      height: 1260px;
      overflow: hidden;
      border-radius: 28px;
      border: 2px solid rgba(10, 74, 52, .12);
      background: #dce7e2;
      box-shadow: 0 38px 96px rgba(18, 61, 48, .2);
    }
    .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
    .screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .screen-map { object-position: center top; transform: scale(1.03); }
    .scene-search { animation: searchScene 17s linear both; }
    .scene-detail { animation: detailScene 17s linear both; }
    .scene-plan { animation: planScene 17s linear both; }
    .scene-end { animation: endScene 17s linear both; }
    .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,24,17,.05), rgba(3,24,17,.48)); }
    .search-card {
      position: absolute;
      left: 42px;
      right: 42px;
      top: 390px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 24px 70px rgba(13,49,38,.24);
    }
    .search-label { color: #0b6949; font-size: 25px; font-weight: 800; }
    .search-box {
      display: flex;
      align-items: center;
      margin-top: 16px;
      height: 90px;
      padding: 0 28px;
      border: 3px solid #0c7853;
      border-radius: 16px;
      color: #111c18;
      background: #fff;
      font-size: 38px;
      font-weight: 800;
    }
    .magnify { margin-right: 18px; font-size: 42px; }
    .typed::after { content: ""; animation: typeBuilding 17s steps(3, end) both; }
    .caret { width: 3px; height: 44px; margin-left: 5px; background: #0c7853; animation: blink .65s step-end infinite; }
    .result {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 18px;
      padding: 22px;
      border-radius: 16px;
      background: #ecf7f1;
      opacity: 0;
      transform: translateY(14px);
      animation: showResult 17s ease both;
    }
    .pin { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 12px; color: white; background: #08754f; font-size: 31px; }
    .result strong { display: block; font-size: 34px; }
    .result span { display: block; margin-top: 5px; color: #5b6964; font-size: 24px; }
    .tap {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 5px solid rgba(255,255,255,.92);
      border-radius: 50%;
      background: rgba(10,122,83,.35);
      box-shadow: 0 0 0 0 rgba(23,167,113,.42);
      opacity: 0;
      animation: tapPulse 17s ease-out both;
    }
    .search-tap { right: 112px; top: 670px; }
    .detail-source { object-position: center bottom; transform: scale(1.16); }
    .callout {
      position: absolute;
      left: 34px;
      right: 34px;
      bottom: 34px;
      display: flex;
      gap: 14px;
      padding: 22px;
      color: #fff;
      background: rgba(6,36,27,.91);
      border-radius: 16px;
      font-size: 29px;
      font-weight: 800;
    }
    .callout span { flex: 1; text-align: center; }
    .callout b { color: #87e0b8; }
    .plan-source { object-position: center 42%; transform: scale(1.15); }
    .plan-badge {
      position: absolute;
      top: 58px;
      right: 38px;
      padding: 16px 22px;
      color: #fff;
      background: #0a6e4c;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
    }
    .end-card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 74px;
      color: white;
      background: #073d2d;
    }
    .end-kicker { color: #8ce0ba; font-size: 27px; font-weight: 850; }
    .end-card h2 { margin: 24px 0 0; font-size: 80px; line-height: 1.16; letter-spacing: 0; }
    .end-card p { margin: 34px 0 0; color: rgba(255,255,255,.78); font-size: 34px; line-height: 1.55; }
    .end-button { align-self: flex-start; margin-top: 60px; padding: 25px 34px; border-radius: 14px; color: #083b2c; background: #fff; font-size: 34px; font-weight: 900; }
    .steps {
      position: absolute;
      z-index: 20;
      left: 62px;
      right: 62px;
      bottom: 92px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .step { padding: 20px 12px; border-radius: 12px; color: #738079; background: #fff; border: 1px solid #d7e1dc; text-align: center; font-size: 26px; font-weight: 850; }
    .step:nth-child(1) { animation: step1 17s linear both; }
    .step:nth-child(2) { animation: step2 17s linear both; }
    .step:nth-child(3) { animation: step3 17s linear both; }
    .subtitle {
      position: absolute;
      z-index: 30;
      left: 75px;
      right: 75px;
      bottom: 205px;
      min-height: 82px;
      display: grid;
      place-items: center;
      padding: 15px 22px;
      border-radius: 12px;
      color: #fff;
      background: rgba(7,20,16,.9);
      font-size: 34px;
      line-height: 1.45;
      font-weight: 850;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
    }
    .subtitle span { position: absolute; opacity: 0; }
    .subtitle span:nth-child(1) { animation: sub1 17s linear both; }
    .subtitle span:nth-child(2) { animation: sub2 17s linear both; }
    .subtitle span:nth-child(3) { animation: sub3 17s linear both; }
    .subtitle span:nth-child(4) { animation: sub4 17s linear both; }
    body.no-captions .subtitle { display: none; }
    @keyframes searchScene { 0%, 36% { opacity: 1; } 39%, 100% { opacity: 0; } }
    @keyframes detailScene { 0%, 34% { opacity: 0; } 39%, 62% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes planScene { 0%, 60% { opacity: 0; } 65%, 82% { opacity: 1; } 86%, 100% { opacity: 0; } }
    @keyframes endScene { 0%, 81% { opacity: 0; } 86%, 100% { opacity: 1; } }
    @keyframes typeBuilding { 0%, 11% { content: ""; } 15% { content: "上"; } 18% { content: "上海"; } 21%, 100% { content: "上海楼"; } }
    @keyframes showResult { 0%, 21% { opacity: 0; transform: translateY(14px); } 25%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes tapPulse { 0%, 27% { opacity: 0; transform: scale(.7); box-shadow: 0 0 0 0 rgba(23,167,113,.42); } 30% { opacity: 1; transform: scale(1); } 35% { opacity: 0; transform: scale(.95); box-shadow: 0 0 0 45px rgba(23,167,113,0); } 100% { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes step1 { 0%, 37% { color: #fff; background: #08754f; } 40%, 100% { color: #738079; background: #fff; } }
    @keyframes step2 { 0%, 37% { color: #738079; background: #fff; } 40%, 63% { color: #fff; background: #08754f; } 66%, 100% { color: #738079; background: #fff; } }
    @keyframes step3 { 0%, 63% { color: #738079; background: #fff; } 66%, 100% { color: #fff; background: #08754f; } }
    @keyframes sub1 { 0%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes sub2 { 0%, 21% { opacity: 0; } 24%, 48% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes sub3 { 0%, 47% { opacity: 0; } 50%, 77% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes sub4 { 0%, 76% { opacity: 0; } 80%, 100% { opacity: 1; } }
  </style>
</head>
<body>
  <main class="film">
    <div class="brand"><span class="brand-mark"></span>仰恩新生指南 · 非官方</div>
    <div class="counter">地图找楼 / 01</div>
    <div class="headline">到校第一天，<br><strong>你真找得到宿舍吗？</strong></div>

    <section class="stage">
      <div class="scene scene-search">
        <img class="screen screen-map" src="../xhs-assets/page-map.png" alt="校园地图手机页面">
        <div class="scrim"></div>
        <div class="search-card">
          <div class="search-label">先搜楼名，不用在群里反复问</div>
          <div class="search-box"><span class="magnify">⌕</span><span class="typed"></span><i class="caret"></i></div>
          <div class="result">
            <div class="pin">⌖</div>
            <div><strong>上海楼</strong><span>宿舍 · 可查看位置与路线</span></div>
          </div>
        </div>
        <div class="tap search-tap"></div>
      </div>

      <div class="scene scene-detail">
        <img class="screen detail-source" src="assets/map-selected.png" alt="上海楼详情与路线入口">
        <div class="callout"><span><b>01</b> 选中地点</span><span><b>02</b> 规划步行</span></div>
      </div>

      <div class="scene scene-plan">
        <img class="screen plan-source" src="assets/plan-selected.png" alt="学校平面图保留上海楼选中状态">
        <div class="plan-badge">切换后地点仍保留</div>
      </div>

      <div class="scene scene-end">
        <div class="end-card">
          <div class="end-kicker">新生到校少走弯路</div>
          <h2>搜楼、看路线、<br>对照平面图</h2>
          <p>一个页面完成，不用重新找地点。</p>
          <div class="end-button">主页置顶看入口</div>
        </div>
      </div>
    </section>

    <div class="subtitle">
      <span>第一次到仰恩，别再靠一句“往生活区走”</span>
      <span>直接搜楼名，地图会定位，路线也能马上规划</span>
      <span>切到学校平面图，选中的地点还在</span>
      <span>主页置顶看入口 · 非官方学生维护</span>
    </div>

    <div class="steps">
      <div class="step">1 搜楼名</div>
      <div class="step">2 看路线</div>
      <div class="step">3 对照平面图</div>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search)
    if (params.get('captions') === '0') document.body.classList.add('no-captions')
  </script>
</body>
</html>
