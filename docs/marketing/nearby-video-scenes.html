<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仰恩新生指南 · 吃喝玩乐短视频分镜</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      --green: #0f6b4b;
      --deep: #082f27;
      --mint: #dff4e9;
      --cream: #fff8ec;
      --orange: #f2a45c;
      --ink: #10211c;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 1920px; background: #dce8e2; }
    body { width: 1280px; overflow: hidden; }
    body.capture {
      width: 1280px;
      min-height: 720px;
      height: 720px;
      background: #dce8e2;
    }

    body.capture #scene {
      width: 405px;
      height: 720px;
      margin-left: 437.5px;
      overflow: hidden;
    }

    body.capture .scene {
      margin-left: 0;
      transform: scale(.375);
      transform-origin: left top;
    }

    .scene {
      position: relative;
      width: 1080px;
      height: 1920px;
      margin-left: 100px;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 8%, rgba(246, 189, 118, .28), transparent 30%),
        radial-gradient(circle at 8% 86%, rgba(93, 179, 142, .2), transparent 32%),
        #f4f8f5;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(17, 91, 69, .15) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, #000, transparent 38%);
      opacity: .55;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 13px 24px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .08em;
      backdrop-filter: blur(12px);
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #78e2b0;
      box-shadow: 0 0 26px rgba(120, 226, 176, .9);
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 100px; line-height: 1.08; letter-spacing: -.06em; }
    h2 { font-size: 76px; line-height: 1.12; letter-spacing: -.045em; }
    h3 { font-size: 38px; line-height: 1.25; }
    p { font-size: 32px; line-height: 1.65; color: #496058; }

    .hero {
      color: white;
      background: #102f26;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.82) contrast(1.04);
    }

    .hero-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(5, 24, 20, .26), rgba(5, 24, 20, .82) 76%, #051c17),
        radial-gradient(circle at 60% 28%, rgba(61, 185, 130, .18), transparent 36%);
    }

    .hero-content {
      position: absolute;
      z-index: 2;
      inset: 0;
      padding: 150px 84px 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-copy { margin-top: 520px; max-width: 900px; }
    .hero h1 { margin-top: 42px; text-shadow: 0 12px 50px rgba(0, 0, 0, .32); }
    .hero p { margin-top: 36px; color: rgba(255, 255, 255, .82); font-size: 36px; }

    .hero-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 36px;
      border-top: 1px solid rgba(255,255,255,.2);
      font-size: 28px;
      color: rgba(255,255,255,.7);
    }

    .route-orbit {
      position: absolute;
      right: 54px;
      top: 278px;
      width: 440px;
      height: 300px;
      border: 3px dashed rgba(130, 235, 181, .5);
      border-radius: 52% 48% 54% 46%;
      transform: rotate(-7deg);
    }

    .route-orbit::before,
    .route-orbit::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border: 6px solid white;
      border-radius: 50%;
      background: #21a46f;
      box-shadow: 0 0 0 14px rgba(47, 193, 132, .18);
    }

    .route-orbit::before { left: -12px; bottom: 58px; }
    .route-orbit::after { right: -12px; top: 72px; }

    .content {
      position: relative;
      z-index: 2;
      padding: 112px 70px;
      height: 100%;
    }

    .dark-chip {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--deep);
      color: white;
      font-size: 26px;
      font-weight: 700;
    }

    .lead { margin-top: 30px; max-width: 900px; }
    .sublead { margin-top: 26px; max-width: 900px; }

    .screen-card {
      position: relative;
      margin-top: 84px;
      padding: 22px;
      border-radius: 42px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 42px 100px rgba(17, 73, 56, .18);
      border: 1px solid rgba(25, 105, 78, .12);
    }

    .screen-card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      width: 110px;
      height: 8px;
      border-radius: 99px;
      background: #c6d7cf;
      transform: translateX(-50%);
    }

    .screen-card img {
      display: block;
      width: 100%;
      border-radius: 26px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 54px;
    }

    .pill {
      padding: 18px 28px;
      border-radius: 999px;
      font-size: 28px;
      font-weight: 700;
      background: white;
      border: 1px solid #d6e3dd;
      box-shadow: 0 12px 32px rgba(27, 80, 63, .08);
    }

    .pill.active { color: white; background: var(--green); border-color: var(--green); }

    .feature-strip {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 94px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .feature-strip div {
      padding: 22px 18px;
      border-radius: 24px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(17, 99, 72, .1);
      font-size: 25px;
      text-align: center;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 430px 430px;
      gap: 20px;
      margin-top: 72px;
    }

    .tile {
      position: relative;
      overflow: hidden;
      border-radius: 36px;
      box-shadow: 0 26px 70px rgba(16, 69, 52, .16);
    }

    .tile.large { grid-row: 1 / span 2; }
    .tile img { width: 100%; height: 100%; object-fit: cover; }
    .tile::after {
      content: "";
      position: absolute;
      inset: 36% 0 0;
      background: linear-gradient(transparent, rgba(6, 24, 20, .82));
    }

    .tile-label {
      position: absolute;
      z-index: 2;
      left: 30px;
      right: 30px;
      bottom: 28px;
      color: white;
    }

    .tile-label span { font-size: 24px; opacity: .72; }
    .tile-label h3 { margin-top: 9px; font-size: 36px; }

    .number-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 44px;
    }

    .number-row div {
      padding: 24px 10px;
      text-align: center;
      border-radius: 22px;
      background: white;
      font-size: 24px;
      font-weight: 700;
      color: #294f42;
    }

    .phone-scene {
      background:
        linear-gradient(148deg, #0c5c43, #07372e 52%, #0e2b25);
      color: white;
    }

    .phone-scene p { color: rgba(255,255,255,.72); }
    .phone-shell {
      position: absolute;
      left: 203px;
      top: 470px;
      width: 674px;
      height: 1338px;
      padding: 26px;
      border-radius: 84px;
      background: #061c17;
      box-shadow: 0 58px 130px rgba(0,0,0,.46);
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 18px;
      width: 170px;
      height: 34px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: #061c17;
    }

    .phone-shell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      border-radius: 60px;
      background: white;
    }

    .route-scene { background: #edf5f1; }
    .route-screen {
      position: absolute;
      left: 74px;
      right: 74px;
      top: 480px;
      height: 880px;
      overflow: hidden;
      padding: 18px;
      border-radius: 42px;
      background: #fff;
      box-shadow: 0 42px 110px rgba(20, 80, 62, .2);
    }

    .route-screen img {
      width: 1540px;
      height: 866px;
      object-fit: cover;
      object-position: center;
      transform: translateX(-310px);
      border-radius: 26px;
    }

    .trip-summary {
      position: absolute;
      left: 74px;
      right: 74px;
      bottom: 105px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .trip-card {
      padding: 30px;
      border-radius: 28px;
      background: white;
      border: 1px solid #d4e4dc;
    }

    .trip-card small { color: #6b7e77; font-size: 23px; }
    .trip-card strong { display: block; margin-top: 12px; font-size: 31px; color: var(--deep); }

    .final {
      color: white;
      background:
        radial-gradient(circle at 50% 20%, rgba(83, 208, 148, .24), transparent 34%),
        linear-gradient(160deg, #0b4d39, #061f1a 72%);
    }

    .final .content { display: flex; flex-direction: column; justify-content: center; }
    .final h2 { font-size: 106px; max-width: 920px; }
    .final p { color: rgba(255,255,255,.72); margin-top: 38px; }

    .final-list {
      margin-top: 90px;
      display: grid;
      gap: 22px;
    }

    .final-item {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 30px 34px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      font-size: 32px;
      font-weight: 700;
    }

    .final-item b {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #6cdaa7;
      color: #0b4a36;
      font-size: 27px;
    }

    .disclaimer {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 94px;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.58);
      font-size: 23px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main id="scene"></main>
  <script>
    const scene = Number(new URLSearchParams(location.search).get('scene') || 1)
    if (new URLSearchParams(location.search).get('capture') === '1') {
      document.body.classList.add('capture')
    }
    const scenes = {
      1: `
        <section class="scene hero">
          <img class="hero-bg" src="/public/images/intro/yeu-campus-hero.webp" alt="">
          <div class="hero-shade"></div>
          <div class="route-orbit"></div>
          <div class="hero-content">
            <div><span class="eyebrow"><i class="dot"></i> YANG-EN UNIVERSITY</span></div>
            <div class="hero-copy">
              <h1>下课之后<br>不用再问去哪</h1>
              <p>吃喝玩乐重新整理：从学校周边，到泉州市区。</p>
            </div>
            <div class="hero-footer">
              <span>仰恩新生指南 · 2026</span>
              <span>真实地点 / 实时路线 / 往返可查</span>
            </div>
          </div>
        </section>`,
      2: `
        <section class="scene">
          <div class="content">
            <span class="dark-chip">01 · 先做选择</span>
            <h2 class="lead">先选范围，<br>再选今天想做什么</h2>
            <p class="sublead">学校周边、泉州市区分开看；吃饭、景点、夜游、看展和商场都有独立标签。</p>
            <div class="screen-card"><img src="/docs/marketing/video-assets/01-nearby-top.png" alt=""></div>
            <div class="pill-row">
              <span class="pill active">泉州市区</span>
              <span class="pill">边走边吃</span>
              <span class="pill">逛景点</span>
              <span class="pill">晚上去哪</span>
              <span class="pill">看展看戏</span>
            </div>
            <div class="feature-strip">
              <div>不挤在一长页</div>
              <div>标签直接切换</div>
              <div>多个地点可挑</div>
            </div>
          </div>
        </section>`,
      3: `
        <section class="scene">
          <div class="content">
            <span class="dark-chip">02 · 多个地点</span>
            <h2 class="lead">每个标签，<br>都给你好几个选择</h2>
            <p class="sublead">第一次逛古城、去海边吹风、看演出，按当天时间和预算挑，不强塞固定路线。</p>
            <div class="gallery">
              <article class="tile large">
                <img src="/public/images/nearby/citywalk.webp" alt="">
                <div class="tile-label"><span>第一次进城</span><h3>开元寺 · 西街 · 钟楼</h3></div>
              </article>
              <article class="tile">
                <img src="/public/images/nearby/city-food.webp" alt="">
                <div class="tile-label"><span>边走边吃</span><h3>古城小吃路线</h3></div>
              </article>
              <article class="tile">
                <img src="/public/images/nearby/xunpu-life.webp" alt="">
                <div class="tile-label"><span>海边与民俗</span><h3>蟳埔 · 滨海线</h3></div>
              </article>
            </div>
            <div class="number-row">
              <div>吃饭 3</div><div>景点 4</div><div>夜游 2</div><div>展演 2</div><div>商场 2</div>
            </div>
          </div>
        </section>`,
      4: `
        <section class="scene phone-scene">
          <div class="content">
            <span class="eyebrow"><i class="dot"></i> 手机直接挑</span>
            <h2 class="lead">不再从一整篇攻略里<br>慢慢滑、慢慢找</h2>
            <p class="sublead">卡片把适合谁、费用提醒、出发建议和来源放在一起。</p>
            <div class="phone-shell"><img src="/docs/marketing/video-assets/04-nearby-city-mobile.png" alt=""></div>
          </div>
        </section>`,
      5: `
        <section class="scene route-scene">
          <div class="content">
            <span class="dark-chip">03 · 真实往返</span>
            <h2 class="lead">不是只告诉你去哪，<br>还要告诉你怎么回来</h2>
            <p class="sublead">先核对具体目的地，再用公交 API 查询学校出发与返校路线；组合地点也能逐个切换。</p>
            <div class="route-screen"><img src="/docs/marketing/video-assets/02-route-modal.png" alt=""></div>
            <div class="trip-summary">
              <div class="trip-card"><small>从学校出发</small><strong>K6 → K602</strong></div>
              <div class="trip-card"><small>回仰恩大学</small><strong>K602 → K6</strong></div>
            </div>
          </div>
        </section>`,
      6: `
        <section class="scene final">
          <div class="content">
            <span class="eyebrow"><i class="dot"></i> 新生第一次出去玩</span>
            <h2 class="lead">找得到。<br>去得了。<br>回得来。</h2>
            <p>地点、来源、公交、步行和打车入口放在同一个地方。</p>
            <div class="final-list">
              <div class="final-item"><b>1</b> 学校周边和泉州市区分开选</div>
              <div class="final-item"><b>2</b> 每个标签都有多个真实地点</div>
              <div class="final-item"><b>3</b> 按具体目的地查出发与返校</div>
            </div>
            <div class="disclaimer">非学校官方平台，由学生维护。商家营业、景区开放、票价与公交班次会变化，出发前请以当天地图、官方通知和现场信息为准。</div>
          </div>
        </section>`
    }
    document.getElementById('scene').innerHTML = scenes[scene] || scenes[1]
  </script>
</body>
</html>
