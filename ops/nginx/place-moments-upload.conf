location = /api/place-moments/images {
    # 学生随手拍上图接口：应用层上限 5MB（server/api/place-moments/images.post.ts），
    # 这里给 6m 留 multipart 边界与表单字段的余量。不加这一段会落到 @nuxt 的
    # 256k 默认值，5MB 的手机照片在 Nginx 就被 413 挡掉，前端只会看到「上传失败」。
    client_max_body_size 6m;
    limit_req zone=yeu_global burst=20 nodelay;
    limit_req zone=yeu_per_edge burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $yeu_forwarded_client_ip;
    proxy_set_header X-Forwarded-For $yeu_forwarded_client_ip;
    set $yeu_moment_fwd_proto $http_x_forwarded_proto;
    if ($yeu_moment_fwd_proto = "") { set $yeu_moment_fwd_proto https; }
    proxy_set_header X-Forwarded-Proto $yeu_moment_fwd_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    add_header Cache-Control 'private, no-store' always;
    add_header CDN-Cache-Control no-store always;
    add_header Edge-Control no-store always;
}
