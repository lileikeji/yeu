# Only these observed SpeedOnline/LeCDN origin peers may supply X-Forwarded-For.
# Unknown/new edges safely fall back to their TCP source address until reviewed.
geo $yeu_trusted_cdn_edge {
    default 0;
    ***REMOVED*** 1;
    ***REMOVED*** 1;
    ***REMOVED*** 1;
    ***REMOVED*** 1;
    ***REMOVED*** 1;
}

map "$yeu_trusted_cdn_edge:$http_x_forwarded_for" $yeu_forwarded_client_ip {
    default $remote_addr;
    ~^1:([0-9A-Fa-f:.]+)(?:,\s*.*)?$ $1;
}
