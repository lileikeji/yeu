# Only CDN origin peers listed here may supply X-Forwarded-For.
# Unknown/new edges safely fall back to their TCP source address until reviewed.
# 开源仓库只保留结构与 RFC5737 文档段占位（203.0.113.0/24）；
# 真实 CDN 出口清单在服务器端维护（覆盖本文件后再 nginx -s reload），
# 未替换时走 TCP 源地址回退，限流按边缘节点 IP 计，功能保守但安全。
geo $yeu_trusted_cdn_edge {
    default 0;
    203.0.113.10 1;
    203.0.113.11 1;
    203.0.113.12 1;
    203.0.113.13 1;
    203.0.113.14 1;
}

map "$yeu_trusted_cdn_edge:$http_x_forwarded_for" $yeu_forwarded_client_ip {
    default $remote_addr;
    ~^1:([0-9A-Fa-f:.]+)(?:,\s*.*)?$ $1;
}
