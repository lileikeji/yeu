# Safe server-level return: only the explicit automation variable can reach it.
# The intermediate status lets the named location attach headers without using
# `add_header` inside an `if` block (which older Nginx builds reject).
if ($yeu_block_automation = 1) {
    return 418;
}

error_page 418 = @yeu_automation_blocked;

location @yeu_automation_blocked {
    add_header Cache-Control "private, no-store" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Retry-After "3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 403;
}

# The hidden application link lands here so the source IP, UA and visitor event
# are retained by the existing Nitro route. It intentionally returns 404.
location = /__yeu_crawl_trap__ {
    limit_req zone=yeu_honeypot burst=1 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $yeu_forwarded_client_ip;
    proxy_set_header X-Forwarded-For $yeu_forwarded_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
