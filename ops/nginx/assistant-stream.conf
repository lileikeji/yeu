location = /api/public/assistant/stream {
    client_max_body_size 256k;
    limit_req zone=yeu_global burst=160 nodelay;
    limit_req zone=yeu_per_edge burst=120 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    set $yeu_stream_fwd_proto $http_x_forwarded_proto;
    if ($yeu_stream_fwd_proto = "") { set $yeu_stream_fwd_proto https; }
    proxy_set_header X-Forwarded-Proto $yeu_stream_fwd_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
    add_header CDN-Cache-Control no-store always;
    add_header Edge-Control no-store always;
}
