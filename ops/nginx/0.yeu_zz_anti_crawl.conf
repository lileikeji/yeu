# Known automation clients are blocked before they consume Nuxt SSR work.
# Keep this list explicit: a broad `bot` match would block legitimate search
# engines and ordinary in-app browsers.
map $http_user_agent $yeu_suspicious_ua {
    default 0;
    ~*(headlesschrome|playwright|puppeteer|selenium|phantomjs|scrapy|python-(requests|httpx)|aiohttp|go-http-client|bytespider|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|ccbot|perplexitybot|google-extended|coze) 1;
}

# Public discovery endpoints and verification files must remain reachable by
# automated validators. The application middleware still protects public HTML
# and APIs when a request bypasses this Nginx instance.
map $uri $yeu_automation_exempt_path {
    default 0;
    ~^/admin(?:/|$) 1;
    ~^/api/admin(?:/|$) 1;
    ~^/api/health$ 1;
    ~^/robots\.txt$ 1;
    ~^/sitemap\.xml$ 1;
    ~^/seo/(?:live/)?(?:robots|sitemap)\.xml$ 1;
    ~^/\.well-known(?:/|$) 1;
    ~^/__yeu_crawl_trap__$ 1;
}

map "$yeu_suspicious_ua:$yeu_automation_exempt_path" $yeu_block_automation {
    default 0;
    ~^1:0$ 1;
}

# A separate low-rate bucket prevents a crawler from hammering the trap.
limit_req_zone $binary_remote_addr zone=yeu_honeypot:10m rate=1r/m;
