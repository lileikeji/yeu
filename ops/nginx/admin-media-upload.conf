location = /api/admin/media/images {
    client_max_body_size 6m;
    limit_req zone=yeu_global burst=20 nodelay;
    limit_req zone=yeu_per_edge burst=10 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    set $yeu_upload_fwd_proto $http_x_forwarded_proto;
    if ($yeu_upload_fwd_proto = "") { set $yeu_upload_fwd_proto https; }
    proxy_set_header X-Forwarded-Proto $yeu_upload_fwd_proto;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    add_header Cache-Control 'private, no-store' always;
    add_header CDN-Cache-Control no-store always;
    add_header Edge-Control no-store always;
}
